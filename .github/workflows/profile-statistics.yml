name: Refresh profile statistics

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: profile-statistics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'jamshid-muxsinov/jamshid-muxsinov' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref }}
      - name: Check calendar and streak calculations
        run: python3 -B -m unittest discover -s scripts -p 'test_profile_metrics.py'
      - name: Fetch public statistics and generate images
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/update_profile.py
      - name: Publish the complete snapshot on this branch
        run: |
          git add -- assets/stats/snapshot.json assets/stats/summary.md assets/stats/statistics*.svg assets/stats/contributions*.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public GitHub statistics'
          git push origin "HEAD:${GITHUB_REF}"
