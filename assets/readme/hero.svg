<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Jamshid Muxsinov — builder, experimenter, product engineer</title>
  <desc id="desc">A cobalt typographic composition with displaced name fragments, correction marks, and a patch symbol expressing build, break, and rebuild.</desc>

  <rect width="1200" height="480" rx="22" fill="#3048D8"/>

  <path d="M1034 0V112L1002 144V480" fill="none" stroke="#191525" stroke-width="16"/>

  <g fill="#F5F2FF" font-family="Arial, Helvetica, sans-serif" font-weight="900">
    <text x="42" y="184" font-size="140" letter-spacing="-5">JAMSHID</text>
    <text x="184" y="320" font-size="126" letter-spacing="-5">MUXSINOV</text>
  </g>

  <text x="52" y="402" fill="#F5F2FF" opacity="0.84" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-style="italic">backend developer</text>
  <path d="M39 386C156 365 291 413 394 375" fill="none" stroke="#FF6257" stroke-width="10" stroke-linecap="round"/>

  <g transform="translate(362 353) rotate(-1)">
    <rect width="505" height="62" rx="3" fill="#D9FF57"/>
    <text x="22" y="43" fill="#191525" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="900" letter-spacing="-1">PRODUCT ENGINEER / MAKER</text>
  </g>

  <g transform="translate(980 78)">
    <text text-anchor="end" fill="#F5F2FF" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800" letter-spacing="0.4">
      <tspan x="0" y="0">BACKEND</tspan>
      <tspan x="0" y="52">UI / MOBILE</tspan>
      <tspan x="0" y="104">INFRA / AGENTS</tspan>
    </text>
  </g>
</svg>
