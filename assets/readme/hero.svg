<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Jamshid Muxsinov — Python Backend Engineer</title>
  <desc id="desc">Portfolio header in risograph zine style: bold name with color misregistration on kraft paper.</desc>

  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feBlend in="SourceGraphic" in2="gray" mode="multiply"/>
    </filter>
  </defs>

  <!-- kraft paper background -->
  <rect width="1280" height="320" rx="0" fill="#F4E8C1"/>

  <!-- grain overlay -->
  <rect width="1280" height="320" fill="#F4E8C1" filter="url(#grain)" opacity="0.4"/>

  <!-- red misregistration shadow — offset 4px right, 3px down -->
  <text x="96" y="165" fill="#E8453C" opacity="0.7" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="88" letter-spacing="-2" transform="translate(4 3)">JAMSHID</text>
  <text x="96" y="245" fill="#E8453C" opacity="0.7" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="88" letter-spacing="-2" transform="translate(4 3)">MUXSINOV</text>

  <!-- main name — black -->
  <text x="92" y="162" fill="#1A1A1A" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="88" letter-spacing="-2">JAMSHID</text>
  <text x="92" y="242" fill="#1A1A1A" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="88" letter-spacing="-2">MUXSINOV</text>

  <!-- title — blue, stamped feel -->
  <rect x="92" y="260" width="420" height="36" fill="#2B4590" transform="rotate(-0.8 92 260)"/>
  <text x="108" y="285" fill="#F4E8C1" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="18" letter-spacing="4">PYTHON BACKEND ENGINEER</text>

  <!-- right side: stack keywords, riso-style patches -->
  <g transform="translate(780 60)">
    <!-- red patch -->
    <rect x="0" y="0" width="380" height="44" fill="#E8453C" opacity="0.85" transform="rotate(-0.5)"/>
    <text x="18" y="30" fill="#F4E8C1" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="20" letter-spacing="2">DJANGO · FASTAPI · AIOGRAM</text>

    <!-- blue patch -->
    <rect x="20" y="60" width="340" height="44" fill="#2B4590" opacity="0.85" transform="rotate(0.3 20 60)"/>
    <text x="38" y="90" fill="#F4E8C1" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="20" letter-spacing="2">POSTGRESQL · REDIS · DOCKER</text>

    <!-- black patch -->
    <rect x="0" y="120" width="300" height="44" fill="#1A1A1A" opacity="0.85" transform="rotate(-0.4 0 120)"/>
    <text x="18" y="150" fill="#F4E8C1" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="20" letter-spacing="2">APIS · WEBSocket · BOTS</text>
  </g>

  <!-- decorative dots — riso registration marks -->
  <circle cx="60" cy="40" r="5" fill="#E8453C" opacity="0.5"/>
  <circle cx="76" cy="40" r="5" fill="#2B4590" opacity="0.5"/>
  <circle cx="60" cy="56" r="5" fill="#2B4590" opacity="0.5"/>
  <circle cx="76" cy="56" r="5" fill="#E8453C" opacity="0.5"/>

  <!-- bottom line -->
  <line x1="92" y1="300" x2="500" y2="300" stroke="#1A1A1A" stroke-width="2" opacity="0.3"/>
</svg>
