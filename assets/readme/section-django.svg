<svg width="1280" height="92" viewBox="0 0 1280 92" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Django product systems">
  <defs>
    <filter id="grain-dj" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feBlend in="SourceGraphic" in2="g" mode="multiply"/>
    </filter>
  </defs>

  <rect width="1280" height="92" fill="#F4E8C1"/>
  <rect width="1280" height="92" fill="#F4E8C1" filter="url(#grain-dj)" opacity="0.3"/>

  <!-- misregistration shadow -->
  <rect x="28" y="16" width="520" height="58" fill="#E8453C" opacity="0.6" transform="translate(3 2) rotate(-0.3)"/>

  <!-- main patch -->
  <rect x="28" y="16" width="520" height="58" fill="#E8453C" transform="rotate(-0.3)"/>

  <text x="48" y="55" fill="#F4E8C1" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="32" letter-spacing="3">DJANGO / PRODUCT SYSTEMS</text>
</svg>
