<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="120" viewBox="0 0 1200 120"
     role="img" aria-labelledby="title desc">
  <title id="title">Django Projects</title>
  <desc id="desc">Section header for Django-based projects</desc>

  <defs>
    <linearGradient id="django-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="120" rx="0" fill="#0a0e1a"/>

  <!-- Accent line -->
  <rect x="56" y="30" width="4" height="60" rx="2" fill="url(#django-grad)"/>

  <!-- Django icon (simplified "d" shape) -->
  <g transform="translate(80 35)">
    <rect x="0" y="0" width="50" height="50" rx="10" fill="#0c1e2c" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="12" y="37" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="28" font-weight="700" fill="#14b8a6">D</text>
  </g>

  <!-- Section title -->
  <g transform="translate(148 42)">
    <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="14" font-weight="500" fill="#14b8a6" letter-spacing="2">FRAMEWORK</text>
    <text x="0" y="50" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="32" font-weight="700" fill="#e2e8f0">Django Projects</text>
  </g>

  <!-- Project count badge -->
  <g transform="translate(1060 40)">
    <rect x="0" y="0" width="80" height="40" rx="20" fill="#0c1e2c" stroke="#14b8a6" stroke-width="1"/>
    <text x="40" y="26" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="14" font-weight="600" fill="#14b8a6" text-anchor="middle">3</text>
  </g>

  <!-- Bottom line -->
  <line x1="56" y1="100" x2="1144" y2="100" stroke="#1e293b" stroke-width="1"/>
</svg>
